<div class="min-h-screen flex items-center justify-center bg-stone-100 font-sans p-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 md:p-12">
      <div class="text-center mb-6">
        <h1 class="text-3xl sm:text-4xl font-bold text-sky-900">Predial 4.0</h1>
        <p class="text-stone-600 mt-2">Plano Interativo de Manutenção Predial</p>
      </div>

      <!-- BANNER DE AVISO PERMANENTE -->
      <div class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-900 text-xs sm:text-sm leading-relaxed">
        <div class="flex items-start gap-2.5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5 text-amber-600 shrink-0 mt-0.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
          </svg>
          <div>
            <p class="font-bold mb-1">Aviso de Segurança</p>
            <p>Esta versão do Predial 4.0 ainda não possui controle de acesso real. Qualquer pessoa com o link pode usar o app. Não insira dados sensíveis de clientes até a liberação da versão com autenticação.</p>
          </div>
        </div>
      </div>

      <form (ngSubmit)="handleLogin()">
        <div class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-bold text-stone-700 mb-2">Nome para identificação no laudo</label>
            <input 
              type="text" 
              id="email"
              [(ngModel)]="email"
              name="email"
              placeholder="Ex: Eng. Carlos / carlos@exemplo.com"
              class="w-full px-4 py-3 bg-stone-50 border border-stone-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition"
              required>
          </div>
        </div>
        <div class="mt-8 space-y-4">
          <button 
            type="submit"
            class="w-full bg-sky-800 text-white font-bold py-3 px-4 rounded-lg hover:bg-sky-900 transition-colors shadow-lg transform hover:scale-105 cursor-pointer">
            Identificar e Continuar
          </button>
          <button 
            type="button"
            (click)="handleGuestAccess()"
            class="w-full bg-stone-200 text-stone-800 font-bold py-3 px-4 rounded-lg hover:bg-stone-300 transition-colors cursor-pointer">
            Acesso sem identificação
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
