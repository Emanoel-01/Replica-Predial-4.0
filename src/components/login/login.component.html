<div class="min-h-screen flex items-center justify-center bg-stone-100 font-sans p-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 md:p-10 border border-stone-200/80">
      
      <!-- CABEÇALHO DA MARCA -->
      <div class="text-center mb-6 space-y-1">
        <div class="text-2xl font-bold" style="font-family:'Poppins','Inter',sans-serif; color:#132A41; letter-spacing:-.02em;">
          Amorim<span style="color:#B5642A;">Tech</span>
        </div>
        <p class="text-[10px] uppercase text-stone-400 tracking-[0.2em]">Ecossistema 4.0</p>
        <h1 class="text-3xl sm:text-4xl font-black tracking-tight pt-2" style="font-family:'Poppins','Inter',sans-serif; color:#132A41;">
          Predial <span style="color:#B5642A;">4.0</span>
        </h1>
      </div>

      <!-- CONVITE AO TOUR GUIADO -->
      <div class="mb-6 p-4 rounded-xl border-2 border-dashed" style="border-color:#B5642A; background: linear-gradient(135deg, #FBF8F2, #FFFFFF);">
        <div class="flex items-start gap-3">
          <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background:#B5642A;">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold" style="color:#132A41;">Ainda não conhece o Predial 4.0?</p>
            <p class="text-xs text-stone-500 mt-0.5 leading-relaxed">Faça um tour guiado pela plataforma, sem precisar de login. Você navega pelos módulos e vê como funciona na prática.</p>
            <button
              type="button"
              (click)="startGuestTour.emit()"
              class="mt-2.5 inline-flex items-center gap-1.5 text-xs font-bold px-4 py-2 rounded-lg text-white transition-colors cursor-pointer"
              style="background:#B5642A;"
            >
              <span>Fazer tour guiado agora</span>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 8l4 4m0 0l-4 4m4-4H3" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- FORMULÁRIO DE LOGIN -->
      <div class="space-y-5">
        <div class="text-center">
          <h2 class="text-lg font-bold text-stone-800">Entrar na plataforma</h2>
          <p class="text-xs text-stone-500 mt-0.5">Acesse com seu e-mail e senha cadastrados</p>
        </div>

        <form (ngSubmit)="handleLogin()" class="space-y-4">
          <div>
            <label for="login-email" class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">E-mail</label>
            <input
              type="email"
              id="login-email"
              [(ngModel)]="email"
              name="email"
              placeholder="seu.email@exemplo.com"
              autocomplete="email"
              class="w-full px-3.5 py-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-600 focus:border-sky-600 transition"
              required>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="login-password" class="block text-xs font-bold text-stone-700 uppercase tracking-wider">Senha</label>
              <button
                type="button"
                (click)="handleEsqueciSenha()"
                [disabled]="redefinindoSenha()"
                class="text-xs font-semibold text-sky-700 hover:text-sky-900 hover:underline transition-colors cursor-pointer bg-transparent border-0 p-0">
                @if (redefinindoSenha()) {
                  <span>Enviando...</span>
                } @else {
                  <span>Esqueci minha senha</span>
                }
              </button>
            </div>
            <div class="relative">
              <input
                [type]="showPassword() ? 'text' : 'password'"
                id="login-password"
                [(ngModel)]="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                class="w-full px-3.5 py-2.5 pr-10 bg-stone-50 border border-stone-300 rounded-lg text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-600 focus:border-sky-600 transition"
                required>
              <button
                type="button"
                (click)="toggleShowPassword()"
                class="absolute right-2.5 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-600 p-1 cursor-pointer"
                [title]="showPassword() ? 'Ocultar senha' : 'Ver senha'">
                @if (showPassword()) {
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                  </svg>
                } @else {
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                }
              </button>
            </div>
          </div>

          <div class="pt-2">
            <button
              type="submit"
              [disabled]="loading()"
              class="w-full bg-sky-800 text-white font-bold py-3 px-4 rounded-lg hover:bg-sky-900 disabled:opacity-50 transition-colors shadow-md text-sm cursor-pointer flex items-center justify-center gap-2">
              @if (loading()) {
                <span class="inline-block w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
                <span>Entrando...</span>
              } @else {
                <span>Entrar</span>
              }
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
