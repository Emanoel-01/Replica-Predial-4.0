<div class="min-h-screen flex items-center justify-center bg-stone-100 font-sans p-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 md:p-12">
      <div class="text-center mb-6">
        <h1 class="text-3xl sm:text-4xl font-bold text-sky-900">Predial 4.0</h1>
        <p class="text-stone-600 mt-2">Plano Interativo de Manutenção Predial</p>
      </div>

      @if (linkEnviado()) {
        <div class="text-center space-y-4 py-4">
          <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-8 h-8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
          </div>
          <h2 class="text-xl font-bold text-stone-800">Verifique seu e-mail</h2>
          <p class="text-stone-600 text-sm leading-relaxed">
            Enviamos um link mágico de acesso para <strong class="text-sky-900">{{ email() }}</strong>. Clique no link recebido para entrar.
          </p>
          <div class="pt-4 space-y-3">
            <button
              type="button"
              (click)="resetForm()"
              class="w-full bg-stone-200 text-stone-800 font-bold py-2.5 px-4 rounded-lg hover:bg-stone-300 transition-colors text-sm cursor-pointer">
              Enviar para outro e-mail
            </button>
            <button
              type="button"
              (click)="handleGuestAccess()"
              class="w-full bg-transparent text-stone-600 font-bold py-2 px-4 rounded-lg hover:text-stone-900 transition-colors text-sm cursor-pointer">
              Acesso sem identificação
            </button>
          </div>
        </div>
      } @else {
        <form (ngSubmit)="handleLogin()">
          <div class="space-y-4">
            <div>
              <label for="email" class="block text-sm font-bold text-stone-700 mb-2">E-mail</label>
              <input
                type="email"
                id="email"
                [(ngModel)]="email"
                name="email"
                placeholder="seu.email@exemplo.com"
                class="w-full px-4 py-3 bg-stone-50 border border-stone-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition"
                required>
            </div>
          </div>
          <div class="mt-8 space-y-4">
            <button
              type="submit"
              [disabled]="loading()"
              class="w-full bg-sky-800 text-white font-bold py-3 px-4 rounded-lg hover:bg-sky-900 disabled:opacity-50 transition-colors shadow-lg transform hover:scale-105 cursor-pointer">
              {{ loading() ? 'Enviando link...' : 'Entrar com e-mail' }}
            </button>
            <button
              type="button"
              (click)="handleGuestAccess()"
              class="w-full bg-stone-200 text-stone-800 font-bold py-3 px-4 rounded-lg hover:bg-stone-300 transition-colors cursor-pointer">
              Acesso sem identificação
            </button>
          </div>
        </form>
      }
    </div>
  </div>
</div>
